<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e22" />
      <stop offset="100%" stop-color="#04060d" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Rectangle Background -->
  <rect width="64" height="64" rx="16" fill="url(#grad2)" stroke="url(#grad1)" stroke-width="2" />
  
  <!-- Stylized Letter 'A' with Code Brackets -->
  <g filter="url(#glow)">
    <!-- Left Bracket < -->
    <path d="M 16 26 L 10 32 L 16 38" fill="none" stroke="#a855f7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Central Letter A -->
    <path d="M 32 18 L 22 46 L 27 46 L 29.5 39 L 34.5 39 L 37 46 L 42 46 Z M 30.5 35 L 32 28 L 33.5 35 Z" fill="url(#grad1)" />
    
    <!-- Right Bracket > -->
    <path d="M 48 26 L 54 32 L 48 38" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
